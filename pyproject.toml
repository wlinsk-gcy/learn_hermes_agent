[build-system]
# 表示构建这个项目之前，构建环境里至少要有 setuptools>=69。
requires = ["setuptools>=69"]
# 表示用 setuptools 作为构建后端。
# setuptools主要干三件事：1.让 src/ 布局能被正确识别为 Python 包。2.让 [project.scripts] 里的命令行入口生效。3.让 uv run learn-hermes-agent doctor 这种命令能稳定工作。
build-backend = "setuptools.build_meta"

[project]
name = "learn-hermes-agent"
version = "0.1.0"
description = "A from-scratch learning reimplementation of Hermes Agent"
requires-python = ">=3.11"
dependencies = []

# cli入口，让 [project.scripts] 里的命令行入口生效
[project.scripts]
# 创建一个名为`learn-hermes-agent`的命令，执行时调用learn_hermes_agent.cli模块里面的main()函数
learn-hermes-agent = "learn_hermes_agent.cli.main:main"

# 明确告诉 uv/setuptools 包在 src/ 下
[tool.setuptools.packages.find]
where = ["src"]